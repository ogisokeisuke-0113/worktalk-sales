<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>データエクスポート</title></head>
<body style="font-family:sans-serif;padding:40px;">
<h2>提案データエクスポート</h2>
<button id="btn" style="padding:12px 24px;font-size:16px;background:#1a5285;color:white;border:none;border-radius:8px;cursor:pointer;">CSVダウンロード</button>
<p id="result"></p>
<script>
document.getElementById('btn').addEventListener('click', function() {
  const data = JSON.parse(localStorage.getItem('worktalk_proposals') || '[]');
  const headers = ['initialDate','companyName','industry','employeeScale','salesRep','contactName','other','position','status','decisionMakerDate','conclusionDate','relationship','lossReason','lossReasonDetail','notes'];
  const headerJa = ['初回提案日時','企業名','業種','従業員規模','営業担当','担当者','その他','役職','提案状況','決済者アポ日','結論日','関係性','失注理由','失注理由詳細','備考'];
  const rows = data.map(p => headers.map(h => '"' + ((p[h] ?? '').toString().replace(/"/g, '""')) + '"').join(','));
  const bom = '\uFEFF';
  const csv = bom + [headerJa.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'proposals_export_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('result').innerHTML = '<b style="color:green;">✓ ' + data.length + '件をエクスポートしました</b>';
});
</script>
</body></html>
