name: ビルドして本番へ配信

# main に push すると、ここでビルドして gh-pages へ配信する。
# 手元で build して dist を手で push する運用をやめるためのもの。
# これで「配信されているもの = main のあるコミット」が常に成立する。

on:
  push:
    branches: [main]
  workflow_dispatch:      # 手動実行もできる

permissions:
  contents: write

concurrency:
  group: deploy-pages     # 同時実行を防ぐ（後勝ちで壊さない）
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 接続先はリポジトリの .env.production 一本に統一する。
      # env: で VITE_SUPABASE_URL を渡すと、未設定のとき空文字で上書きされ
      # .env.production が無効になる（2026-09-11 に実際にそれで配信が止まった）。
      - name: ビルド
        run: npm run build

      # ── 安全装置 ────────────────────────────────────────────
      # 架電記録の保存修正が入っていないビルドを配信させない。
      # 2026-09-10 に、修正がソースに無いまま deploy すると
      # 巻き戻る状態だったため、ここで機械的に止める。
      - name: 架電記録の保存修正が含まれているか確認
        run: |
          if ! grep -q "wt-save" dist/assets/*.js; then
            echo "::error::架電記録の保存修正がビルド結果に含まれていません。SOURCE-PATCH.md を反映してから push してください。"
            exit 1
          fi
          echo "保存修正の混入を確認しました"

      - name: 接続先のSupabaseプロジェクトを確認
        run: |
          EXPECTED="antqewvlzfonsakgndxt.supabase.co"
          if ! grep -q "$EXPECTED" dist/assets/*.js; then
            echo "::error::ビルド結果が本番のSupabaseプロジェクト($EXPECTED)を向いていません。"
            echo "::error::.env.production / リポジトリ変数 VITE_SUPABASE_URL を確認してください。"
            echo "::error::別プロジェクト(arhgxtdwnsciwmotvokl)を向いたまま配信すると、全員が空のDBに繋がります。"
            exit 1
          fi
          echo "接続先OK: $EXPECTED"

      # ── 回帰テスト ──────────────────────────────────────────
      # 2026-09-17 に、架電結果の絞り込みを別の改修で書き直した際、
      # 「未架電（履歴なし）」の条件が黙って無効化され全件表示になった。
      # Git は両方を正しい変更として受け入れるため衝突も警告も出ない。
      # 機械が毎回確かめる以外に防ぐ方法が無いので、ここで配信前に止める。
      # 通信はすべて偽物に差し替えたうえ、*.supabase.co は解決不能にしてあるので
      # 本番DBには一切触れない。
      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: 回帰テスト
        run: npm run test:e2e

      - name: gh-pages へ配信
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/pages gh-pages
          # 過去のバンドルは消さない。配信直後、古いHTMLを掴んでいる人が
          # 古いJSを取りに来ることがあるため。
          cp -R dist/. /tmp/pages/
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし。配信をスキップします"
          else
            git commit -m "deploy: ${{ github.sha }}"
            git push origin gh-pages
          fi
